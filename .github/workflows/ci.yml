name: UML CI

on:
  push:
    branches: [um-arm64]
  # Every pull request, not just the ones aimed at the default branch: a
  # stacked PR targeting another feature branch would otherwise get no CI at
  # all, which is exactly when a reviewer most wants it.
  pull_request:

permissions:
  contents: read

jobs:
  x86_64-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install UML build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison clang flex libelf-dev libssl-dev lld llvm
      - name: Build x86_64 UML reference
        run: |
          make ARCH=um SUBARCH=x86 LLVM=1 O=out/x86_64 \
            STUB_EXE_LDFLAGS='-fuse-ld=lld -Wl,-n -Wl,--no-rosegment -static' \
            defconfig
          make ARCH=um SUBARCH=x86 LLVM=1 O=out/x86_64 \
            STUB_EXE_LDFLAGS='-fuse-ld=lld -Wl,-n -Wl,--no-rosegment -static' \
            -j2

  # Cross-compile the parts that have to run on the phone.  Deliberately
  # non-blocking: it needs a 3 GB NDK download, so a network hiccup on the
  # runner would otherwise turn a green tree red for reasons that have nothing
  # to do with the change.  Its job is to tell us early that the bionic build
  # path broke, not to gate merges -- the Termux host gate is the real
  # evidence, and it cannot run here at all.
  android-bionic-build:
    name: android-bionic-build
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r29
        run: |
          set -eux
          curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/android-ndk-r29" "$RUNNER_TEMP/ndk"
          echo "NDK=$RUNNER_TEMP/ndk" >> "$GITHUB_ENV"

      - name: Cross-compile umnet for Android
        run: |
          set -eux
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOL/clang" --target=aarch64-linux-android30 -static -O2 \
            -std=c11 -Wall -Wextra -Werror \
            tools/um-arm64/harness/umnet.c -o "$RUNNER_TEMP/umnet"
          file "$RUNNER_TEMP/umnet"
          file "$RUNNER_TEMP/umnet" | grep -q 'ARM aarch64'
          file "$RUNNER_TEMP/umnet" | grep -q 'statically linked'

      - name: Prove the Android build is what the phone needs
        run: |
          set -eux
          # No interpreter: Android has no /lib/ld-linux-aarch64.so.1, so a
          # dynamically linked binary dies before main with no output at all.
          if readelf -l "$RUNNER_TEMP/umnet" | grep -q INTERP; then
            echo "umnet has an interpreter (not static)" >&2
            exit 1
          fi
          readelf -h "$RUNNER_TEMP/umnet" | grep -q AArch64

      # The companion passt is a separate project, so check that its patch
      # still applies to the pinned upstream revision and that the patched
      # source remains buildable for bionic.
      - name: Check the passt patch applies and builds for Android
        run: |
          set -eux
          PATCH=tools/um-arm64/harness/passt-bionic.patch
          test -f "$PATCH"
          # Bump this revision together with the patch when rebasing it.
          git clone -q --filter=blob:none https://github.com/qemus/passt.git "$RUNNER_TEMP/passt"
          git -C "$RUNNER_TEMP/passt" checkout -q df90211db4b08a06ed4e499ffa40bf8811100a2f
          git -C "$RUNNER_TEMP/passt" apply --check "$GITHUB_WORKSPACE/$PATCH"
          git -C "$RUNNER_TEMP/passt" apply "$GITHUB_WORKSPACE/$PATCH"
          git -C "$RUNNER_TEMP/passt" apply --reverse --check "$GITHUB_WORKSPACE/$PATCH"
          cd "$RUNNER_TEMP/passt"
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          make CC="$TOOL/clang --target=aarch64-linux-android30" \
               ARCH=aarch64 TARGET=aarch64-linux-android \
               VERSION=pinned-bionic \
               CFLAGS="-static -Wl,-z,max-page-size=16384" \
               CPPFLAGS="-UPAGE_SIZE -DPAGE_SIZE=16384" \
               passt >"$RUNNER_TEMP/passt-build.log" 2>&1 || {
            tail -50 "$RUNNER_TEMP/passt-build.log" >&2; exit 1; }
          file passt
          file passt | grep -q 'ARM aarch64'
          file passt | grep -q 'statically linked'
          if "$TOOL/llvm-readelf" -l passt | grep -q INTERP; then
            echo "passt has an interpreter (not static)" >&2
            exit 1
          fi
          if ! "$TOOL/llvm-readelf" -n passt 2>/dev/null | grep -qi android; then
            echo "passt has no Android ABI note" >&2
            exit 1
          fi
          LOAD_ALIGNMENTS=$("$TOOL/llvm-readelf" -l passt | awk '$1 == "LOAD" { print $NF }')
          test -n "$LOAD_ALIGNMENTS"
          for align in $LOAD_ALIGNMENTS; do
            if [ "$((align))" -lt 16384 ]; then
              echo "passt has LOAD alignment $align < 16384 (16 KiB)" >&2
              exit 1
            fi
          done

  harness-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install a cross compiler for the release fixtures
        run: |
          sudo apt-get update
          # The release checker's self-test builds its fixtures with TARGET_CC
          # when one is available, so the aarch64 gate is exercised on a real
          # binary instead of a synthesised header.
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Check harness scripts
        run: |
          bash -n harness/*.sh tools/um-arm64/harness/*.sh
          sh -n harness/um-init harness/test-um-init.sh harness/test-um-init-cmdline.sh
          harness/test-um-init.sh
          harness/test-um-init-cmdline.sh
          sh tools/um-arm64/harness/test-umnet.sh
          python3 -m py_compile harness/*.py tools/um-arm64/harness/test-umnet-network.sh tools/um-arm64/harness/verify-release.py
          # Prove the release checker rejects broken releases.  A checker that
          # has never rejected anything is not a checker.  TARGET_CC makes the
          # fixtures real aarch64 binaries, so the architecture gate is covered
          # rather than reported as synthesised.
          TARGET_CC=aarch64-linux-gnu-gcc \
            python3 tools/um-arm64/harness/verify-release.py self-test
          # Syntax only: the network gate needs a real kernel and passt on the
          # Termux host, so CI checks that it parses and reports its usage.
          python3 tools/um-arm64/harness/test-umnet-network.sh --help >/dev/null
      - name: Check required project documents
        run: |
          test -s README.md
          test -s docs/UPSTREAM.md
          test -s docs/BUILD.md
          test -s docs/TESTING.md
          test -s docs/SECURITY.md
          test -s docs/CONTRIBUTING.md
          test -s docs/RELEASE.md
